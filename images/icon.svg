<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2330"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <linearGradient id="k" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="1" stop-color="#c9c2ae"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="84" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="84" fill="none" stroke="#3a4458" stroke-width="6"/>

  <!-- K: stem -->
  <rect x="70" y="92" width="78" height="328" rx="10" fill="url(#k)"/>
  <!-- K: upper and lower arms, running into the reticle -->
  <polygon points="148,232 148,300 300,166 268,128" fill="url(#k)"/>
  <polygon points="148,212 148,280 268,384 300,346" fill="url(#k)"/>

  <!-- Reticle on the right side -->
  <g transform="translate(352 256)">
    <circle r="112" fill="#0c0f16" fill-opacity="0.55"/>
    <circle r="112" fill="none" stroke="#e8463c" stroke-width="14"/>
    <circle r="62" fill="none" stroke="#e8463c" stroke-width="5" stroke-opacity="0.7"/>
    <!-- crosshair lines with a gap at the center -->
    <g stroke="#e8463c" stroke-width="9" stroke-linecap="round">
      <line x1="0" y1="-136" x2="0" y2="-24"/>
      <line x1="0" y1="24" x2="0" y2="136"/>
      <line x1="-136" y1="0" x2="-24" y2="0"/>
      <line x1="24" y1="0" x2="136" y2="0"/>
    </g>
    <!-- range ticks -->
    <g stroke="#e8463c" stroke-width="5" stroke-linecap="round">
      <line x1="-8" y1="44" x2="8" y2="44"/>
      <line x1="-8" y1="80" x2="8" y2="80"/>
      <line x1="44" y1="-8" x2="44" y2="8"/>
      <line x1="80" y1="-8" x2="80" y2="8"/>
    </g>
    <circle r="7" fill="#ff5a4e"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
